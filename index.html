<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Benchtop">
<meta name="theme-color" content="#0f1012">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">

<title>Benchtop Calculator</title>
<style>
html{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:#0f1012;-webkit-text-size-adjust:100%}
body{margin:0;font-size:14px;overflow:hidden;overscroll-behavior:none}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: one hand-held instrument, a single column. LCD on top, a strip of mode tabs, then either the keypad or one work panel. */
:root{
  color-scheme:dark;
  --page:#0f1012; --body:#1c1e22; --key:#31343b; --key-fn:#24272c; --well:#0f1013; --line:#363a43;
  --ink:#efeee8; --dim:#9da0a8; --second:#f2a23a; --alpha:#66c9b3; --red:#c9543d;
  --lcd:#c7d2be; --lcd-ink:#17201b; --lcd-dim:#66756a;
  --f-ui:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,'Segoe UI',Roboto,sans-serif;
  --f-mono:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;
}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f-ui);box-sizing:border-box;display:flex;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
*{box-sizing:border-box}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--alpha);outline-offset:2px}
.app{width:100%;max-width:430px;height:100%;max-height:900px;margin-block:auto;background:var(--body);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0}
.brand{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px;font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.brand b{font-weight:600;color:var(--ink);letter-spacing:.22em}

.lcd{background:var(--lcd);color:var(--lcd-ink);border-radius:10px;padding:8px 12px 8px;font-family:var(--f-mono);box-shadow:inset 0 2px 7px rgba(0,0,0,.4)}
.ann{display:flex;gap:6px;align-items:center;font:600 10px/1 var(--f-ui);letter-spacing:.08em;min-height:20px}
.ann button{background:none;border:1px solid var(--lcd-dim);color:var(--lcd-ink);border-radius:4px;padding:4px 6px;font:inherit;letter-spacing:inherit}
.ann button.off{opacity:.28;border-color:transparent}
.ann .note{margin-left:auto;font-weight:500;letter-spacing:.02em;text-align:right}
.expr{min-height:3em;max-height:5.8em;overflow-y:auto;font-size:17px;line-height:1.45;word-break:break-all;margin-top:6px;cursor:text}
.expr .t-v{font-weight:600}
.expr .ph{color:var(--lcd-dim);font:13px var(--f-ui);word-break:normal}
.caret{display:inline-block;width:0;height:1.15em;border-left:2px solid var(--lcd-ink);margin:0 -1px;vertical-align:text-bottom;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.caret{animation:none}}
.res{font-size:30px;font-weight:500;text-align:right;min-height:1.3em;line-height:1.3;white-space:nowrap;overflow-x:auto;font-variant-numeric:tabular-nums}
.res.long{font-size:23px;line-height:1.7}
.res.stale{opacity:.4}
.res.err{font:600 15px/2.6 var(--f-ui);white-space:normal}
sup{font-size:.62em;line-height:0}
.x10{font-size:.7em;margin-left:.15em}

.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tabs button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:7px 0;font:600 11px var(--f-ui);letter-spacing:.1em}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#15171a;border-color:var(--ink)}

.pane{flex:1;min-height:0;overflow-y:auto}
.keys{height:100%;min-height:372px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(4,.82fr) repeat(4,1fr);gap:7px}
.key{border:0;border-radius:9px;background:var(--key-fn);color:var(--ink);font:500 15px var(--f-ui);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;user-select:none;-webkit-user-select:none;min-width:0}
.key .sec{font:600 10px/13px var(--f-ui);height:13px;color:var(--second);border-radius:3px;padding:0 4px}
.key .main{line-height:1.15}
.key.num{background:var(--key);font:500 21px var(--f-mono)}
.key.num .main{margin-bottom:6px}
.key.op{background:var(--key);font-size:21px}
.key.red{background:var(--red)}
.key.k2{background:var(--second);color:#1d1507}
.key.alpha .main{color:var(--alpha)}
.key.eq{background:var(--ink);color:#15171a;font-size:22px}
.key.small .main{font-size:13px}
.key:active{filter:brightness(1.4);transform:translateY(1px)}
.keys.second .key.has2 .sec{background:var(--second);color:#1d1507}
.keys.second .key.has2 .main{opacity:.35}

.panel{min-height:100%;background:#15171a;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:12px}
.card{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px}
.lab{font:600 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.in{background:var(--well);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 10px;font:16px var(--f-mono);min-width:0;width:100%}
textarea.in{font-size:12px;min-height:110px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.btn{background:var(--ink);color:#15171a;border:1px solid var(--ink);border-radius:8px;padding:9px 12px;font:600 13px var(--f-ui);white-space:nowrap;flex:0 0 auto}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.warn{background:none;color:#f0907c;border-color:var(--red)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{background:none;border:0;border-bottom:2px solid var(--line);color:var(--dim);padding:8px 0;font:600 12px var(--f-ui)}
.seg button[aria-pressed="true"]{color:var(--ink);border-color:var(--second)}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.chip{background:var(--well);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px;font:13px var(--f-mono);display:flex;gap:8px;align-items:baseline;min-width:0;overflow:hidden}
.chip b{color:var(--alpha);font-weight:600}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:6px}
.vrow,.hrow{display:flex;gap:6px;align-items:stretch}
.vmain,.hx,.hr{background:var(--well);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:9px 10px;text-align:left;font:14px var(--f-mono);min-width:0}
.vmain{flex:1;display:flex;flex-direction:column;gap:3px}
.vn{font:600 14px var(--f-ui);color:var(--alpha);overflow-wrap:anywhere}
.vn small{font-weight:400;color:var(--dim);font-size:12px;margin-left:6px}
.vv i{font-style:normal;color:var(--dim);font-size:12px}
.icon{flex:0 0 42px;background:none;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:16px}
.hx{flex:1;word-break:break-all}
.hr{flex:0 1 auto;max-width:50%;text-align:right;color:var(--second);white-space:nowrap;overflow-x:auto}
.empty,.hint,.msg{margin:0;color:var(--dim);font-size:13px;line-height:1.5}
.msg{color:#f0907c;min-height:0}
.shead,.srow{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center}
.shead{font:600 11px var(--f-ui);color:var(--dim);letter-spacing:.06em}
.sn{color:var(--dim);font:12px var(--f-mono);text-align:right}
#srows{display:flex;flex-direction:column;gap:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.stat{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 8px;background:var(--well);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font:14px var(--f-mono);min-width:0;text-align:left}
.stat span{color:var(--dim);font:12px var(--f-ui)}
.stat b{font-weight:500;margin-left:auto;font-variant-numeric:tabular-nums}
.stat.wide{grid-column:1/-1;font-size:16px;padding:12px 10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.fld{display:flex;flex-direction:column;gap:4px;font:12px var(--f-ui);color:var(--dim);min-width:0}
</style>
</head>
<body>

<div class="app">
  <header class="brand"><b>Benchtop</b><span>scientific · stats · units · chem</span></header>
  <section class="lcd" aria-label="Display">
    <div class="ann" id="ann"></div>
    <div class="expr" id="expr" aria-label="Expression"></div>
    <div class="res" id="res" aria-live="polite"></div>
  </section>
  <nav class="tabs" id="tabs" aria-label="Modes">
    <button data-tab="calc">CALC</button><button data-tab="hist">HIST</button><button data-tab="stat">STAT</button><button data-tab="conv">CONV</button><button data-tab="chem">CHEM</button>
  </nav>
  <main class="pane"><div class="keys" id="keys"></div><div class="panel" id="panel" hidden></div></main>
</div>

<script id="engine">
/* ---------- engine: no DOM in this block ---------- */
const SLOTS=['A','B','C','D','E','F','X','Y','M'];

 ['F','Faraday constant',NA*QE,'C/mol'],
 ['kB','Boltzmann constant',KB,'J/K'],
 ['h','Planck constant',PLANCK,'J·s'],
 ['ħ','Reduced Planck constant',PLANCK/(2*Math.PI),'J·s'],
 ['c','Speed of light in vacuum',299792458,'m/s'],
 ['qe','Elementary charge',QE,'C'],
 ['u','Atomic mass constant',1.66053906892e-27,'kg'],
 ['me','Electron mass',9.1093837139e-31,'kg'],
 ['mp','Proton mass',1.67262192595e-27,'kg'],
 ['mn','Neutron mass',1.67492750056e-27,'kg'],
 ['Vm','Molar volume of ideal gas, 0 °C and 1 atm',RGAS*273.15/101.325,'L/mol'],
 ['Vm100','Molar volume of ideal gas, 0 °C and 100 kPa',RGAS*273.15/100,'L/mol'],
 ['atm','Standard atmosphere',101325,'Pa'],

 ['g','Standard gravity',9.80665,'m/s²'],
 ['G','Gravitational constant',6.67430e-11,'m³/(kg·s²)'],
 ['ε0','Vacuum permittivity',8.8541878188e-12,'F/m'],
 ['R∞','Rydberg constant',10973731.568157,'m⁻¹'],
 ['a0','Bohr radius',5.29177210544e-11,'m'],
 ['σ','Stefan–Boltzmann constant',5.670374419e-8,'W/(m²·K⁴)'],

const NOSTD=['Tc','Pm','Po','At','Rn','Fr','Ra','Ac'];

const UNITS={
 Mass:[['kg',1],['g',1e-3],['mg',1e-6],['µg',1e-9],['t (tonne)',1000],['lb',0.45359237],['oz',0.028349523125]],
 Volume:[['L',1],['mL',1e-3],['µL',1e-6],['m³',1000],['cm³',1e-3],['US gal',3.785411784],['imp gal',4.54609],['US qt',0.946352946],['US fl oz',0.0295735295625],['ft³',28.316846592]],
 Length:[['m',1],['km',1000],['cm',1e-2],['mm',1e-3],['µm',1e-6],['nm',1e-9],['Å',1e-10],['pm',1e-12],['in',0.0254],['ft',0.3048],['yd',0.9144],['mi',1609.344]],
 Area:[['m²',1],['cm²',1e-4],['mm²',1e-6],['ha',1e4],['km²',1e6],['acre',4046.8564224],['ft²',0.09290304],['in²',0.00064516]],
 Temperature:[['°C',0],['K',0],['°F',0]],
 Pressure:[['kPa',1e3],['Pa',1],['MPa',1e6],['bar',1e5],['mbar / hPa',100],['atm',101325],['mmHg',133.322387415],['Torr',101325/760],['psi',6894.757293168]],
 Energy:[['J',1],['kJ',1e3],['cal',4.184],['kcal',4184],['eV',QE],['kWh',3.6e6],['L·atm',101.325],['BTU',1055.05585262]]
};
function convert(cat,v,from,to){
  if(cat==='Temperature'){
    const k=from==='°C'?v+273.15:from==='°F'?(v-32)*5/9+273.15:v;
    return to==='°C'?k-273.15:to==='°F'?(k-273.15)*9/5+32:k;
  }
  const f=UNITS[cat].find(u=>u[0]===from)[1],t=UNITS[cat].find(u=>u[0]===to)[1];
  return v*f/t;
}

function E(m,i){return {calc:1,m:m,i:i};}
function lex(toks){
  const out=[];let i=0;const n=toks.length;
  while(i<n){
    const t=toks[i];
    if(t.k==='d'){
      let s='';const start=i;
      while(i<n){const u=toks[i];
        if(u.k==='d'){s+=u.s;i++;}
        else if(u.k==='o'&&(u.s==='−'||u.s==='+')&&s.endsWith('ᴇ')){s+=u.s==='−'?'-':'+';i++;}
        else break;}
      const js=s.replace('ᴇ','e');
      if(!/^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/.test(js))throw E('Syntax error',start);
      out.push({t:'n',v:parseFloat(js),i:start});continue;
    }
    out.push({t:t.k,s:t.s,tok:t,i:i});i++;
  }

}
function factorial(a,i){
  if(a<0||a!==Math.floor(a))throw E('n! needs a whole number ≥ 0',i);
  if(a>170)throw E('Overflow',i);
  let r=1;for(let k=2;k<=a;k++)r*=k;return r;
}

  const fromRad=x=>ctx.angle==='DEG'?x*180/Math.PI:ctx.angle==='GRAD'?x*200/Math.PI:x;
  const snap=v=>Math.round(v*1e15)/1e15;
  function fn(s,a,i){
    switch(s){
      case 'sin(':return snap(Math.sin(toRad(a)));
      case 'cos(':return snap(Math.cos(toRad(a)));
      case 'tan(':{const c=snap(Math.cos(toRad(a)));if(c===0)throw E('tan is undefined here',i);return snap(Math.sin(toRad(a)))/c;}
      case 'sin⁻¹(':if(Math.abs(a)>1)throw E('sin⁻¹ needs −1 to 1',i);return fromRad(Math.asin(a));
      case 'cos⁻¹(':if(Math.abs(a)>1)throw E('cos⁻¹ needs −1 to 1',i);return fromRad(Math.acos(a));
      case 'tan⁻¹(':return fromRad(Math.atan(a));
      case 'log(':if(a<=0)throw E('log needs a positive number',i);return Math.log10(a);
      case 'ln(':if(a<=0)throw E('ln needs a positive number',i);return Math.log(a);
      case '√(':if(a<0)throw E('√ of a negative number',i);return Math.sqrt(a);
      case '∛(':return Math.cbrt(a);
      case '10^(':return Math.pow(10,a);

    if(isOp('×')){p++;v*=juxta();}
    else if(isOp('÷')){p++;const i=at();const d=juxta();if(d===0)throw E('Division by zero',i);v/=d;}
    else return v;}}
  function startsPrimary(){const t=L[p];return !!t&&(t.t==='n'||t.t==='v'||t.t==='f'||t.t==='l');}
  function juxta(){let v=unary();while(startsPrimary())v*=power();return v;}
  function unary(){if(isOp('−')){p++;return -unary();}if(isOp('+')){p++;return unary();}return power();}
  function power(){const i=at();const b=postfix();
    if(isOp('^')){p++;const e=unary();const r=Math.pow(b,e);if(Number.isNaN(r))throw E('No real result',i);return r;}
    return b;}
  function postfix(){let v=primary();for(;;){const t=L[p];if(!t||t.t!=='p')return v;p++;

  if(!Number.isFinite(v))throw E('Overflow',null);
  return v;
}

const minus=s=>s.replace(/-/g,'−');
const trimZ=s=>s.indexOf('.')<0?s:s.replace(/0+$/,'').replace(/\.$/,'');
const sciHTML=(m,e)=>minus(m)+'<span class="x10">×10</span><sup>'+minus(String(e))+'</sup>';
function norm(v,sig){
  if(v===0)return '0';
  const a=Math.abs(v);
  if(a<1e10&&a>=1e-6){const s=v.toPrecision(sig);if(s.indexOf('e')<0)return minus(trimZ(s));}
  const parts=v.toExponential(sig-1).split('e');
  return sciHTML(trimZ(parts[0]),parseInt(parts[1],10));
}
function fmt(v,mode,dig){
  const a=Math.abs(v);
  if(mode==='SCI'){const q=v.toExponential(dig).split('e');return sciHTML(q[0],parseInt(q[1],10));}
  if(mode==='ENG'){
    if(v===0)return sciHTML((0).toFixed(dig),0);
    let e=Math.floor(Math.log10(a)/3)*3,ms=(v/Math.pow(10,e)).toFixed(dig);
    if(Math.abs(parseFloat(ms))>=1000){e+=3;ms=(v/Math.pow(10,e)).toFixed(dig);}
    return sciHTML(ms,e);
  }
  if(mode==='FIX'&&a<1e10)return minus(v.toFixed(dig));
  return norm(v,12);

function numLit(v){return String(Number(Math.abs(v).toPrecision(12))).replace('e+','ᴇ').replace('e','ᴇ');}

function parseNum(s){

  if(s==='')return null;
  const n=Number(s);return Number.isFinite(n)?n:NaN;
}

function molarMass(f){
  f=f.replace(/\s+/g,'');
  if(!f)throw 'Type a formula';
  const counts={};
  for(const part of f.split(/[·.*•]/)){
    if(!part)throw 'Check the formula';
    const lead=/^(\d+)(.*)$/.exec(part);
    const mult=lead?parseInt(lead[1],10):1,body=lead?lead[2]:part;
    if(!body)throw 'Check the formula';
    let p=0;
    const num=()=>{const m=/^\d+/.exec(body.slice(p));if(!m)return 1;p+=m[0].length;return parseInt(m[0],10);};
    const group=()=>{const c={};
      while(p<body.length){const ch=body[p];
        if(ch==='('||ch==='['){p++;const g=group();if(body[p]!==')'&&body[p]!==']')throw 'A bracket is not closed';p++;const n=num();for(const k in g)c[k]=(c[k]||0)+g[k]*n;}
        else if(ch===')'||ch===']')break;
        else{const m=/^[A-Z][a-z]?/.exec(body.slice(p));if(!m)throw 'Unexpected “'+ch+'” (element symbols start with a capital)';
          let sym=m[0];
          if(!(sym in AW)){if(sym.length===2&&(sym[0] in AW))sym=sym[0];else throw 'Unknown element '+sym;}
          p+=sym.length;const n=num();c[sym]=(c[sym]||0)+n;}
      }
      return c;};
    const c=group();
    if(p<body.length)throw 'A bracket is not opened';
    for(const k in c)counts[k]=(counts[k]||0)+c[k]*mult;
  }
  let M=0;for(const k in counts)M+=counts[k]*AW[k];
  return {M:M,counts:counts};
}

function stats(rows){
  let pts=[],bad=0,anyY=false;
  for(const r of rows){
    const x=parseNum(r[0]),y=parseNum(r[1]);
    if(x===null&&y===null)continue;
    if(x===null||Number.isNaN(x)||Number.isNaN(y)){bad++;continue;}
    if(y!==null)anyY=true;
    pts.push([x,y]);
  }
  if(anyY){const n0=pts.length;pts=pts.filter(q=>q[1]!==null);bad+=n0-pts.length;}
  const n=pts.length;
  if(!n)return {n:0,bad:bad,anyY:anyY};
  const sum=a=>a.reduce((s,v)=>s+v,0);
  const xs=pts.map(q=>q[0]),sx=sum(xs),mx=sx/n,Sxx=sum(xs.map(v=>(v-mx)*(v-mx)));
  const so=xs.slice().sort((a,b)=>a-b);
  const o={n:n,bad:bad,anyY:anyY,sx:sx,sxx:sum(xs.map(v=>v*v)),mx:mx,sdx:n>1?Math.sqrt(Sxx/(n-1)):null,pdx:Math.sqrt(Sxx/n),
    min:so[0],max:so[n-1],med:n%2?so[(n-1)/2]:(so[n/2-1]+so[n/2])/2};
  if(anyY){
    const ys=pts.map(q=>q[1]),sy=sum(ys),my=sy/n,Syy=sum(ys.map(v=>(v-my)*(v-my))),Sxy=sum(pts.map(q=>(q[0]-mx)*(q[1]-my)));
    o.sy=sy;o.my=my;o.sdy=n>1?Math.sqrt(Syy/(n-1)):null;o.sxy=sum(pts.map(q=>q[0]*q[1]));
    if(n>1&&Sxx>0){o.b=Sxy/Sxx;o.a=my-o.b*mx;o.r=Syy>0?Sxy/Math.sqrt(Sxx*Syy):null;}
  }
  return o;
}

<script>

  chem(){
    const c=S.ch;
    return '<div class="card"><label class="lab" for="ch-f">Molar mass from a formula</label><input class="in" id="ch-f" placeholder="Ca(NO3)2 or CuSO4.5H2O" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" value="'+esc(c.f)+'"><div class="grid2" id="ch-mm"></div></div>'
     +'<div class="card"><div class="lab">Mass ↔ amount</div><div class="row3"><label class="fld">M (g/mol)<input class="in" id="ch-M" inputmode="decimal" autocomplete="off" value="'+esc(c.M)+'"></label><label class="fld">m (g)<input class="in" id="ch-m" inputmode="decimal" autocomplete="off" value="'+esc(c.m)+'"></label><label class="fld">n (mol)<input class="in" id="ch-n" inputmode="decimal" autocomplete="off" value="'+esc(c.n)+'"></label></div><div class="grid2" id="ch-mn"></div></div>'
     +'<div class="card"><div class="lab">Dilution C₁V₁ = C₂V₂</div><div class="row2">'+['C₁','V₁','C₂','V₂'].map((l,i)=>'<label class="fld">'+l+'<input class="in" id="ch-d'+i+'" inputmode="decimal" autocomplete="off" value="'+esc(c.d[i])+'"></label>').join('')+'</div><div class="grid2" id="ch-dil"></div><p class="hint">Fill three boxes and leave one empty. Use the same unit for both concentrations and for both volumes.</p></div>'
     +'<p class="hint">Atomic weights are IUPAC abridged values, which is why the last digit can differ slightly from a textbook table.</p>';
  }
};
const plain12=v=>String(Number(v.toPrecision(12)));
function srow(r,i){return '<div class="srow"><span class="sn">'+(i+1)+'</span><input class="in" inputmode="decimal" autocomplete="off" id="s'+i+'x" data-s="'+i+',0" aria-label="x '+(i+1)+'" value="'+esc(r[0])+'"><input class="in" inputmode="decimal" autocomplete="off" id="s'+i+'y" data-s="'+i+',1" aria-label="y '+(i+1)+'" value="'+esc(r[1])+'"></div>';}

function updStat(){
  const s=stats(S.stat),out=$('sout'),pred=$('spred');if(!out)return;
  S.reg=(s.b!=null)?s:null;
  pred.hidden=!S.reg;
  if(!s.n){out.innerHTML='<p class="empty">Type measurements in the x column for the mean and standard deviation. Add y values next to them for a regression line, for example absorbance against concentration.'+(s.bad?' '+s.bad+' row(s) could not be read.':'')+'</p>';return;}
  let h='<div class="grid2">'+insBtn('n',s.n)+insBtn('mean x̄',s.mx);
  if(s.sdx!=null)h+=insBtn('s (sample)',s.sdx);
  h+=insBtn('σ (population)',s.pdx);
  if(s.sdx!=null&&s.mx!==0)h+=insBtn('CV %',Math.abs(s.sdx/s.mx)*100);
  h+=insBtn('median',s.med)+insBtn('min',s.min)+insBtn('max',s.max)+insBtn('Σx',s.sx)+insBtn('Σx²',s.sxx);
  if(s.anyY){
    h+=insBtn('mean ȳ',s.my);if(s.sdy!=null)h+=insBtn('s of y',s.sdy);h+=insBtn('Σy',s.sy)+insBtn('Σxy',s.sxy);
    if(s.b!=null){h+=insBtn('a (intercept)',s.a)+insBtn('b (slope)',s.b);if(s.r!=null)h+=insBtn('r',s.r)+insBtn('r²',s.r*s.r);}
  }
  h+='</div><p class="hint">'+(s.anyY?'Line of best fit: y = a + b·x, using the '+s.n+' rows that have both x and y. ':'')+(s.bad?s.bad+' row(s) left out because a value is missing or unreadable. ':'')+'Tap any figure to put it in the calculation.</p>';
  out.innerHTML=h;updPred();
}
function updPred(){
  const o=$('spout');if(!o||!S.reg){return;}
  const x=parseNum($('px').value),y=parseNum($('py').value);let h='';
  if(x!=null&&!Number.isNaN(x))h+=insBtn('ŷ at x',S.reg.a+S.reg.b*x);
  if(y!=null&&!Number.isNaN(y)&&S.reg.b!==0)h+=insBtn('x̂ at y',(y-S.reg.a)/S.reg.b);
  o.innerHTML=h;
}
function updConv(){
  const c=S.cv,o=$('cv-out');if(!o)return;
  const v=parseNum(c.val);
  if(v==null){o.innerHTML='';return;}
  if(Number.isNaN(v)){o.innerHTML='<p class="msg">That value could not be read.</p>';return;}
  const r=convert(c.cat,v,c.from,c.to);
  o.innerHTML=insBtn(minus(plain(v))+' '+c.from+' =',r,true).replace('</b>',' '+c.to+'</b>');
}
function updChem(){
  const c=S.ch,mm=$('ch-mm');if(!mm)return;
  if(!c.f.trim())mm.innerHTML='';
  else{try{
      const r=molarMass(c.f),M=Number(r.M.toFixed(3));
      const parts=Object.keys(r.counts).map(k=>k+(r.counts[k]>1?'×'+r.counts[k]:'')).join(' · ');
      const flag=Object.keys(r.counts).filter(k=>NOSTD.indexOf(k)>=0);
      mm.innerHTML=insBtn('M (g/mol)',M,true)+'<p class="hint" style="grid-column:1/-1">'+parts+(flag.length?'. '+flag.join(', ')+' has no standard atomic weight; the mass number of its longest-lived isotope is used.':'')+'</p><button class="btn ghost" data-a="chuse" data-v="'+M+'" style="grid-column:1/-1">Use as M below</button>';
    }catch(e){mm.innerHTML='<p class="msg" style="grid-column:1/-1">'+esc(typeof e==='string'?e:'Check the formula')+'</p>';}}
  const M=parseNum(c.M),mn=$('ch-mn');let h='';
  if(M>0){
    if(c.last==='m'){const m=parseNum(c.m);if(m!=null&&!Number.isNaN(m)){c.n=plain(m/M);$('ch-n').value=c.n;h=insBtn('n (mol)',m/M,true);}}
    else{const n=parseNum(c.n);if(n!=null&&!Number.isNaN(n)){c.m=plain(n*M);$('ch-m').value=c.m;h=insBtn('m (g)',n*M,true);}}
  }
  mn.innerHTML=h;
  const dv=c.d.map(parseNum),empty=dv.map((v,i)=>v==null?i:-1).filter(i=>i>=0),dil=$('ch-dil');
  if(empty.length===1&&dv.every((v,i)=>i===empty[0]||(!Number.isNaN(v)&&v>0))){
    const i=empty[0],v=i===0?dv[2]*dv[3]/dv[1]:i===1?dv[2]*dv[3]/dv[0]:i===2?dv[0]*dv[1]/dv[3]:dv[0]*dv[1]/dv[2];
    dil.innerHTML=insBtn(['C₁','V₁','C₂','V₂'][i]+' =',v,true);
  }else dil.innerHTML='';
}
function drawPane(){
  const calc=S.tab==='calc';
  $('keys').hidden=!calc;$('panel').hidden=calc;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===S.tab)));
  if(calc)return;
  $('panel').innerHTML=PANELS[S.tab]();
  if(S.tab==='stat')updStat();else if(S.tab==='conv')updConv();else if(S.tab==='chem')updChem();
}
function drawAll(){drawLCD();drawKeys();drawPane();}
function back(note){S.tab='calc';S.sto=null;S.edit=null;S.note=note||'';drawAll();}
function flipSign(el){if(!el)return;const v=el.value.trim();el.value=v.charAt(0)==='-'||v.charAt(0)==='−'?v.slice(1):'-'+v;el.dispatchEvent(new Event('input',{bubbles:true}));el.focus();}

const DO={
  second:ACT.second,drg:ACT.drg,fse:ACT.fse,
  insv(el){insValue(Number(el.dataset.v));},
  hload(el){const h=S.hist[+el.dataset.n];S.toks=h.e.slice();S.cur=S.toks.length;S.res=h.r;S.err=null;S.fresh=false;back();},
  hres(el){insValue(S.hist[+el.dataset.n].r);},
  hclear(){if(S.confirmClear){S.hist=[];S.confirmClear=false;save();}else S.confirmClear=true;drawPane();},
  sub(el){S.sub=el.dataset.id;S.edit=null;drawPane();},
  rcl(el){const id=el.dataset.id,m=S.mine.find(x=>x.id===id);S.tab='calc';ins({k:'v',id:id,s:m?m.name:id});drawPane();},
  const(el){const c=CONSTS[+el.dataset.n];S.tab='calc';ins({k:'v',s:c[0],v:c[2]});drawPane();},
  stoslot(el){S.slots[el.dataset.id]=S.sto;save();back('Stored in '+el.dataset.id);},
  stoname(){
    const name=$('sto-name').value.trim(),unit=$('sto-unit').value.trim();
    if(!name){$('sto-msg').textContent='Give it a name, or pick a letter above.';return;}
    if(SLOTS.indexOf(name)>=0){S.slots[name]=S.sto;save();back('Stored in '+name);return;}
    const ex=S.mine.find(m=>m.name.toLowerCase()===name.toLowerCase());
    if(ex){ex.v=S.sto;if(unit)ex.unit=unit;}
    else S.mine.push({id:'v'+Date.now().toString(36),name:name,v:S.sto,unit:unit});
    save();back((ex?'Updated ':'Stored as ')+name);
  },
  stocancel(){S.sto=null;drawPane();},
  vnew(){S.edit='new';drawPane();$('ed-name').focus();},
  vedit(el){S.edit=el.dataset.id;drawPane();},
  edcancel(){S.edit=null;drawPane();},
  edsave(){
    const name=$('ed-name').value.trim(),unit=$('ed-unit').value.trim(),v=parseNum($('ed-val').value);
    if(!name){$('ed-msg').textContent='The value needs a name.';return;}
    if(SLOTS.indexOf(name)>=0){$('ed-msg').textContent=name+' is one of the letter slots. Pick a different name.';return;}
    if(v==null||Number.isNaN(v)){$('ed-msg').textContent='Type the value as a number, for example 1.86 or 6.02e23.';return;}
    if(S.mine.some(m=>m.id!==S.edit&&m.name.toLowerCase()===name.toLowerCase())){$('ed-msg').textContent='Another value already has that name.';return;}
    if(S.edit==='new')S.mine.push({id:'v'+Date.now().toString(36),name:name,v:v,unit:unit});
    else{const m=S.mine.find(x=>x.id===S.edit);if(m){m.name=name;m.v=v;m.unit=unit;}}
    S.edit=null;save();drawAll();
  },
  eddel(){S.mine=S.mine.filter(m=>m.id!==S.edit);S.edit=null;save();drawAll();},
  bkcopy(){
    const t=$('bk'),msg=$('bk-msg');
    const fail=()=>{t.focus();t.select();msg.textContent='Copying is blocked here. The text is selected so you can copy it yourself.';};
    try{navigator.clipboard.writeText(t.value).then(()=>{msg.textContent='Copied.';},fail);}catch(e){fail();}
  },
  bkrestore(){
    try{const obj=JSON.parse($('bk').value);if(!obj||(!Array.isArray(obj.mine)&&!obj.slots))throw 0;adopt(obj,true);save();drawAll();$('bk-msg').textContent='Restored.';}
    catch(e){$('bk-msg').textContent='That text is not a backup from this calculator.';}
  },
  srow(){S.stat.push(['','']);$('srows').insertAdjacentHTML('beforeend',srow(['',''],S.stat.length-1));$('s'+(S.stat.length-1)+'x').focus();},
  ssign(){flipSign(lastStat&&document.getElementById(lastStat));},
  sclear(){S.stat=[['',''],['',''],['',''],['',''],['','']];lastStat=null;save();drawPane();},
  cvans(){S.cv.val=plain12(S.ans);drawPane();},
  cvsign(){flipSign($('cv-val'));},
  cvswap(){const c=S.cv,t=c.from;c.from=c.to;c.to=t;drawPane();},
  chuse(el){S.ch.M=el.dataset.v;$('ch-M').value=S.ch.M;updChem();}
};

document.addEventListener('click',ev=>{
  const k=ev.target.closest('[data-k]');if(k){press(+k.dataset.k);return;}
  const tb=ev.target.closest('[data-tab]');if(tb){S.tab=tb.dataset.tab;S.sto=null;S.edit=null;S.confirmClear=false;drawPane();return;}
  const a=ev.target.closest('[data-a]');if(a&&DO[a.dataset.a]){DO[a.dataset.a](a);return;}
  if(ev.target.closest('#expr')){
    const sp=ev.target.closest('[data-i]');S.fresh=false;
    if(sp){const r=sp.getBoundingClientRect();S.cur=+sp.dataset.i+(ev.clientX>r.left+r.width/2?1:0);}
    else S.cur=S.toks.length;
    drawLCD();
  }
});
document.addEventListener('focusin',ev=>{if(ev.target.dataset&&ev.target.dataset.s)lastStat=ev.target.id;});
document.addEventListener('input',ev=>{
  const t=ev.target,id=t.id;
  if(t.dataset&&t.dataset.s){
    const q=t.dataset.s.split(','),i=+q[0];S.stat[i][+q[1]]=t.value;
    if(i===S.stat.length-1&&t.value.trim()&&S.stat.length<200){S.stat.push(['','']);$('srows').insertAdjacentHTML('beforeend',srow(['',''],S.stat.length-1));}
    updStat();return;
  }
  if(id==='px'||id==='py'){updPred();return;}
  if(id==='cv-val'){S.cv.val=t.value;updConv();return;}
  if(id==='cv-cat'){const u=UNITS[t.value];S.cv.cat=t.value;S.cv.from=u[0][0];S.cv.to=u[1][0];drawPane();return;}
  if(id==='cv-from'){S.cv.from=t.value;updConv();return;}
  if(id==='cv-to'){S.cv.to=t.value;updConv();return;}
  if(id==='ch-f'){S.ch.f=t.value;updChem();return;}
  if(id==='ch-M'){S.ch.M=t.value;updChem();return;}
  if(id==='ch-m'){S.ch.m=t.value;S.ch.last='m';updChem();return;}
  if(id==='ch-n'){S.ch.n=t.value;S.ch.last='n';updChem();return;}
  if(id&&id.indexOf('ch-d')===0){S.ch.d[+id.slice(4)]=t.value;updChem();}
});
document.addEventListener('change',ev=>{if(ev.target.dataset&&ev.target.dataset.s)save();});
document.addEventListener('keydown',ev=>{
  if(ev.metaKey||ev.ctrlKey||ev.altKey)return;
  const tag=ev.target.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||S.tab!=='calc')return;
  const k=ev.key;let hit=true;
  if(k>='0'&&k<='9')ins(d(k));
  else if(k==='.'||k===',')ins(d('.'));
  else if(k==='+')ins(o('+'));
  else if(k==='-')ins(o('−'));
  else if(k==='*')ins(o('×'));
  else if(k==='/')ins(o('÷'));
  else if(k==='^')ins(o('^'));
  else if(k==='(')ins(LP);
  else if(k===')')ins(RP);
  else if(k==='!')ins(pf('!'));
  else if(k==='Enter'||k==='='){if(tag==='BUTTON'&&k==='Enter')return;equals();}
  else if(k==='Backspace')ACT.del();
  else if(k==='Escape')ACT.ac();
  else if(k==='ArrowLeft')ACT.left();
  else if(k==='ArrowRight')ACT.right();
  else hit=false;
  if(hit)ev.preventDefault();
});

try{adopt(JSON.parse(localStorage.getItem(KEY)||'null'));}catch(e){}
buildKeys();drawAll();initCloud();
</script>

if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){});}
